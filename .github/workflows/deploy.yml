name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: Previously configured deployment environment
        required: true
      operation:
        type: choice
        options: [preview, deploy]
        default: preview
permissions:
  contents: read
  id-token: write
concurrency:
  group: attestra-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: pulumi/setup-pulumi@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Materialize environment configuration
        env:
          APPLICATION_MANIFEST: ${{ vars.APPLICATION_MANIFEST }}
          PULUMI_STACK_YAML: ${{ secrets.PULUMI_STACK_YAML }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          env = os.environ['TARGET_ENVIRONMENT']
          if not re.fullmatch(r'[a-z][a-z0-9-]{0,62}', env):
              raise SystemExit('Invalid environment name')
          for variable, path in [('APPLICATION_MANIFEST', 'apexfission.json'), ('PULUMI_STACK_YAML', f'infra/Pulumi.{env}.yaml')]:
              value = os.environ[variable]
              if not value:
                  raise SystemExit(f'Missing {variable}')
              pathlib.Path(path).write_text(value)
          PY
      - name: Run application deployment engine
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: go run ./cmd/attestra "$OPERATION" --env "$TARGET_ENVIRONMENT"
