name: Deploy
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        description: Component to deploy
        options: [Admin/index, Backend, All]
        default: All
      backend_environment:
        type: string
        description: Logical backend environment (dev, qa, prod, or a custom name)
        default: dev
        required: true
      prefix:
        type: string
        description: Prefix; empty explicitly selects separate final infrastructure
        default: next
      operation:
        type: choice
        options: [preview, deploy, status, health, publish]
        default: preview
permissions:
  contents: read
  id-token: write
concurrency:
  group: attestra-wizard-${{ inputs.prefix || 'final' }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.targets.outputs.shared }}
      backend: ${{ steps.targets.outputs.backend }}
      shared_environment: ${{ steps.targets.outputs.shared_environment }}
      backend_environment: ${{ steps.targets.outputs.backend_environment }}
    steps:
      - id: targets
        env:
          PREFIX: ${{ inputs.prefix }}
          LOGICAL_ENVIRONMENT: ${{ inputs.backend_environment }}
          SCOPE: ${{ inputs.scope }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PY'
          import os, re
          prefix, env = os.environ['PREFIX'], os.environ['LOGICAL_ENVIRONMENT']
          scope, operation = os.environ['SCOPE'], os.environ['OPERATION']
          if prefix and (prefix == 'final' or not re.fullmatch(r'[a-z][a-z0-9]{0,19}', prefix)):
              raise SystemExit('Invalid deployment prefix')
          if not re.fullmatch(r'[a-z][a-z0-9]*(?:-[a-z0-9]+)*', env) or env == 'shared':
              raise SystemExit('Invalid logical environment')
          identity = prefix or 'final'
          if len(identity + '-' + env) > 32:
              raise SystemExit('Backend stack name is too long')
          if scope not in ('Admin/index', 'Backend', 'All') or operation not in ('preview', 'deploy', 'status', 'health', 'publish'):
              raise SystemExit('Invalid deployment operation/scope')
          if operation == 'publish' and scope != 'Backend':
              raise SystemExit('Publication recovery uses Backend scope')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"shared={str(scope in ('Admin/index', 'All')).lower()}\n")
              out.write(f"backend={str(scope in ('Backend', 'All')).lower()}\n")
              out.write(f'shared_environment={identity}-shared\nbackend_environment={identity}-{env}\n')
          PY
  shared:
    needs: plan
    if: needs.plan.outputs.shared == 'true'
    uses: ./.github/workflows/deploy-target.yml
    with:
      github_environment: ${{ needs.plan.outputs.shared_environment }}
      backend_environment: ${{ inputs.backend_environment }}
      prefix: ${{ inputs.prefix }}
      scope: shared
      operation: ${{ inputs.operation }}
    secrets: inherit
  backend:
    needs: [plan, shared]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.backend == 'true' &&
      (needs.shared.result == 'success' || needs.shared.result == 'skipped')
    uses: ./.github/workflows/deploy-target.yml
    with:
      github_environment: ${{ needs.plan.outputs.backend_environment }}
      backend_environment: ${{ inputs.backend_environment }}
      prefix: ${{ inputs.prefix }}
      scope: backend
      operation: ${{ inputs.operation }}
    secrets: inherit
