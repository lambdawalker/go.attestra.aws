name: Resolve verify-email module sums
on:
  push:
    branches:
      - feat/email-code-a-c-integration
    paths:
      - .github/workflows/resolve-verifyemail-sums.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve exact module sums
        shell: bash
        run: |
          set -euo pipefail
          (cd . && go mod download github.com/lambdawalker/go.apexfission.aws.verifyemail)
          (cd infra && go mod download github.com/lambdawalker/go.apexfission.aws.verifyemail github.com/lambdawalker/go.apexfission.aws.verifyemail/infrastructure)
          (cd tools/deploy && go mod download github.com/lambdawalker/go.apexfission.aws.verifyemail)
          git diff -- go.sum infra/go.sum tools/deploy/go.sum
