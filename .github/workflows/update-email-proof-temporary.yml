name: Pin email proof library (temporary)
on:
  push:
    branches:
      - feat/email-code-proof-dependency-20261114
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pin merged direct-code proof library
        run: |
          go get github.com/lambdawalker/go.apexfission.aws.verifyemail@1963f90999f574824951a8b579b1bfb7047ef0ea
          go mod tidy
          go mod verify
          go test ./...
      - name: Commit exact reproducible module hashes
        run: |
          git add go.mod go.sum
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Pin verified email module with direct code proof"
            git fetch origin feat/email-code-proof-dependency-20261114
            git rebase origin/feat/email-code-proof-dependency-20261114
            git push origin HEAD:feat/email-code-proof-dependency-20261114
          fi
