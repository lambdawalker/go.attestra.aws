# Reference only: create the real stack with Pulumi and configure proofKey as a secret.
config:
  aws:region: us-east-1
  aws:allowedAccountIds:
    - '000000000000'
  attestra:senderOnly: false # true only during the initial SES bootstrap; see deployment docs
  attestra:appOrigin: https://app.example.com
  attestra:adminOrigin: https://admin.example.com
  attestra:senderDomain: mail.example.com
  attestra:senderAddress: hello@mail.example.com
  attestra:adminCertificateArn: arn:aws:acm:us-east-1:000000000000:certificate/replace-me
